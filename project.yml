name: StandByPlus
options:
  bundleIdPrefix: com.standbyplus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
schemes:
  StandByPlus:
    build:
      targets:
        StandByPlus: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  StandByPlus:
    type: application
    platform: iOS
    sources:
      - path: StandByPlus
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.standbyplus.app
        PRODUCT_NAME: StandByPlus
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: StandByPlus/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "NO"
