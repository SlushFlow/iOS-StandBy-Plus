name: StandByPlus
options:
  bundleIdPrefix: com.standbyplus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  StandByPlus:
    type: application
    platform: iOS
    sources:
      - path: StandByPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.standbyplus.app
        INFOPLIST_KEY_CFBundleDisplayName: StandBy Plus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: StandByPlus/StandByPlus.entitlements
    info:
      path: StandByPlus/Info.plist
      properties:
        UIBackgroundModes:
          - audio
          - voip
        NSAppleMusicUsageDescription: StandBy Plus displays and controls music playback on your nightstand.
        NSMicrophoneUsageDescription: StandBy Plus shows active call status from apps that use CallKit.
