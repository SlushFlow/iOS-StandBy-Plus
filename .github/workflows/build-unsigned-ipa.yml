name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/**

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build release app without code signing
        run: |
          set -eo pipefail
          xcodebuild \
            -project StandByPlus.xcodeproj \
            -scheme StandByPlus \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/StandByPlus.app" Payload/
          /usr/bin/zip -r StandByPlus-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandByPlus-unsigned-ipa
          path: StandByPlus-unsigned.ipa
