name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -list -project StandByPlus.xcodeproj

      - name: Build ad-hoc signed app
        run: |
          set -euo pipefail
          xcodebuild \
            -project StandByPlus.xcodeproj \
            -scheme StandByPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            build

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/StandByPlus.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH" >&2
            find build/DerivedData -name '*.app' -print >&2
            exit 1
          fi

          EXEC="$APP_PATH/StandByPlus"
          if [ ! -f "$EXEC" ]; then
            echo "Missing Mach-O executable at $EXEC" >&2
            ls -laR "$APP_PATH" >&2
            exit 1
          fi

          EXEC_SIZE=$(stat -f%z "$EXEC")
          APP_SIZE=$(du -sk "$APP_PATH" | awk '{print $1}')
          echo "Executable size: ${EXEC_SIZE} bytes"
          echo "App bundle size: ${APP_SIZE} KB"
          ls -la "$APP_PATH"
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "Embedded frameworks:"
            ls -la "$APP_PATH/Frameworks"
          fi

          if [ "$EXEC_SIZE" -lt 400000 ]; then
            echo "ERROR: Executable is too small (${EXEC_SIZE} bytes). Build is likely incomplete." >&2
            exit 1
          fi

          if [ "$APP_SIZE" -lt 800 ]; then
            echo "ERROR: App bundle is too small (${APP_SIZE} KB). Expected at least 800 KB." >&2
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/StandByPlus.app"
          PAYLOAD_DIR="build/Payload"
          IPA_PATH="build/StandByPlus-unsigned.ipa"

          # GitHub macOS runners attach com.apple.provenance xattrs that cause
          # /usr/bin/zip to silently skip binaries — strip before packaging.
          xattr -cr "$APP_PATH"

          rm -rf "$PAYLOAD_DIR" "$IPA_PATH"
          mkdir -p "$PAYLOAD_DIR"
          ditto "$APP_PATH" "$PAYLOAD_DIR/StandByPlus.app"

          PAYLOAD_EXEC="$PAYLOAD_DIR/StandByPlus.app/StandByPlus"
          PAYLOAD_EXEC_SIZE=$(stat -f%z "$PAYLOAD_EXEC")
          PAYLOAD_SIZE=$(du -sk "$PAYLOAD_DIR/StandByPlus.app" | awk '{print $1}')
          echo "Payload executable size: ${PAYLOAD_EXEC_SIZE} bytes"
          echo "Payload app size: ${PAYLOAD_SIZE} KB"

          if [ "$PAYLOAD_EXEC_SIZE" -lt 400000 ]; then
            echo "ERROR: Payload executable missing or too small." >&2
            exit 1
          fi

          # ditto produces a zip that preserves the Payload/ structure for IPA sideloading
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_DIR" "$IPA_PATH"

          IPA_SIZE=$(stat -f%z "$IPA_PATH")
          echo "IPA size: ${IPA_SIZE} bytes ($(echo "scale=2; $IPA_SIZE / 1048576" | bc) MB)"
          if [ "$IPA_SIZE" -lt 800000 ]; then
            echo "ERROR: IPA is too small (${IPA_SIZE} bytes). Binary was likely excluded during packaging." >&2
            unzip -l "$IPA_PATH" | head -30
            exit 1
          fi
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandByPlus-unsigned-ipa
          path: build/StandByPlus-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload to release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/StandByPlus-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
