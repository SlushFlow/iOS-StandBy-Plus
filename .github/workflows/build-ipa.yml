name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS (no codesign)
        run: |
          xcodebuild \
            -project StandbyMode.xcodeproj \
            -scheme StandbyMode \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ runner.temp }}/StandbyMode.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create unsigned IPA
        run: |
          APP_PATH="${{ runner.temp }}/StandbyMode.xcarchive/Products/Applications/StandbyMode.app"
          
          mkdir -p "${{ runner.temp }}/Payload"
          cp -r "$APP_PATH" "${{ runner.temp }}/Payload/"
          
          cd "${{ runner.temp }}"
          zip -r StandbyMode.ipa Payload -x "*.DS_Store"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandbyMode-unsigned
          path: ${{ runner.temp }}/StandbyMode.ipa
          retention-days: 90

      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/StandbyMode.ipa
          generate_release_notes: true
