name: Build unsigned IPA

on:
  push:
    branches:
      - main
      - "cursor/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build StandBy+ (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project StandByPlus.xcodeproj \
            -scheme StandByPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/StandByPlus.app"
          test -d "$APP_PATH" || { echo "App bundle not found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry StandByPlus.ipa Payload
          ls -lh StandByPlus.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandByPlus-unsigned-ipa
          path: StandByPlus.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: StandByPlus.ipa
