name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - "cursor/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build StandBy+ (unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project StandByPlus.xcodeproj \
            -scheme StandByPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/StandByPlus.xcarchive" \
            clean archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/StandByPlus.xcarchive/Products/Applications/StandByPlus.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built .app not found at $APP_PATH"
            find build -maxdepth 4 -name "*.app" || true
            exit 1
          fi
          rm -rf build/Payload build/StandByPlus-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/"
          (cd build && zip -qry "StandByPlus-unsigned.ipa" "Payload")
          echo "Built IPA:"
          ls -lh build/StandByPlus-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandByPlus-unsigned-ipa
          path: build/StandByPlus-unsigned.ipa
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/StandByPlus-unsigned.ipa
          generate_release_notes: true
